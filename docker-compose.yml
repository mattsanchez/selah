services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: selah
      POSTGRES_PASSWORD: selah
      POSTGRES_DB: selah
    ports:
      - "127.0.0.1:${SELAH_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selah -d selah"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
